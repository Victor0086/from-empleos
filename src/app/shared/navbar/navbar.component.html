<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" routerLink="/">
      <span class="material-icons me-1">work</span> InstantJob
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <!-- Trabajador -->
        <li class="nav-item" *ngIf="auth.isLogged() && auth.role() === 'trabajador'">
          <a class="nav-link" routerLink="/ofertas" routerLinkActive="active">Ofertas</a>
        </li>


        <!-- Empresa -->
        <li class="nav-item" *ngIf="auth.isLogged() && auth.role() === 'empleador'">
          <a class="nav-link" routerLink="/ofertas/nueva" routerLinkActive="active">Publicar</a>
        </li>
      </ul>

      <div class="d-flex">

          <!-- Loading spinner durante login -->
          <div *ngIf="loadingLogin" class="d-flex align-items-center me-2">
            <span class="spinner"></span>
          </div>

          <!-- Botones para usuario no autenticado -->
          <ng-container *ngIf="!loginDisplay && !loadingLogin">
            <button class="btn btn-outline-light d-flex align-items-center me-2" (click)="login()">
              <span class="material-icons me-1">login</span> Ingresar
            </button>
            <button class="btn btn-primary d-flex align-items-center" (click)="crearCuenta()">
              <span class="material-icons me-1">person_add</span> Crear cuenta
            </button>
          </ng-container>

          <!-- Usuario autenticado: mostrar avatar, correo y botones visibles -->
          <div *ngIf="loginDisplay && !loadingLogin" class="d-flex align-items-center position-relative">
            <button type="button" class="btn d-flex align-items-center me-3 user-menu-button" (click)="toggleMenu($event)" style="border:2px solid #fff; background:transparent; color:#fff; border-radius:30px; padding:4px 16px;">
              <span class="avatar-circle me-2" style="width:32px;height:32px;line-height:32px;font-size:1.2rem;background:#888;color:#fff;border-radius:50%;display:inline-block;overflow:hidden;">
                <ng-container *ngIf="fotoUrl; else inicialAvatar">
                  <img [src]="fotoUrl" alt="Avatar" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">
                </ng-container>
                <ng-template #inicialAvatar>
                  {{ given_name ? given_name.charAt(0).toUpperCase() : '?' }}
                </ng-template>
              </span>
              <span class="fw-bold">{{ given_name }}</span>
            </button>
            <div *ngIf="showMenu" class="dropdown-menu show user-dropdown-menu" style="right:0; left:auto; min-width:180px; position:absolute; top:48px; z-index:1000;">
              <button class="dropdown-item d-flex align-items-center" (click)="verMiCV()">
                <span class="material-icons me-2">badge</span> Mi CV
              </button>
              
              <!-- Opciones para trabajadores -->
              <ng-container *ngIf="auth.role() === 'trabajador'">
                <a class="dropdown-item d-flex align-items-center" [routerLink]="'/mis-postulaciones'" (click)="closeMenu()">
                  <span class="material-icons me-2">send</span> Mis postulaciones
                </a>
                <a class="dropdown-item d-flex align-items-center" [routerLink]="'/mis-contratos'" (click)="closeMenu()">
                  <span class="material-icons me-2">send</span> Mis Contratos
                </a>
              </ng-container>
              
              <!-- Opciones para empleadores -->
              <ng-container *ngIf="auth.role() === 'empleador'">
                <a class="dropdown-item d-flex align-items-center" [routerLink]="'/ofertas'" (click)="closeMenu()">
                  <span class="material-icons me-2">work</span> Mis ofertas laborales
                </a>
                <a class="dropdown-item d-flex align-items-center" [routerLink]="'/mis-contratos'" (click)="closeMenu()">
                  <span class="material-icons me-2">description</span> Mis Contratos
                </a>
                <a class="dropdown-item d-flex align-items-center" [routerLink]="'/ofertas/nueva'" (click)="closeMenu()">
                  <span class="material-icons me-2">add_circle</span> Crear nueva oferta
                </a>
              </ng-container>
              
            </div>
            <button class="btn btn-warning d-flex align-items-center ms-2" (click)="logout()">
              <span class="material-icons me-1">logout</span> Cerrar sesión
            </button>
          </div>
      </div>
    </div>
  </div>
</nav>
