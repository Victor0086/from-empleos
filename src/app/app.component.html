

<app-navbar></app-navbar>
<main class="container-fluid p-0 min-vh-100">
  <!-- Hero Section solo en la ruta principal -->
  <section *ngIf="mostrarHero" class="hero-section d-flex flex-column align-items-center justify-content-center text-center" style="background: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1500&q=80') center/cover no-repeat; min-height: 60vh; color: #fff; position: relative;">
    <div style="background: rgba(0,0,0,0.5); padding: 3rem 2rem; border-radius: 1rem;">
      <h1 class="display-4 fw-bold mb-3">Bienvenido a Web Empleos</h1>
      <p class="lead mb-4">Conecta trabajadores y empresas de forma 100% online.<br>Tu próximo trabajo esporádico comienza aquí.</p>
      <a class="btn btn-primary btn-lg shadow" [routerLink]="'/ofertas'">Explora Ofertas</a>
      <button class="btn btn-success btn-lg ms-3 shadow" (click)="abrirRegistroModal()">Regístrate Gratis</button>
    </div>
  </section>
  <section class="d-flex flex-column align-items-center justify-content-center mt-5">
    <p *ngIf="!loginDisplay">Inicia sesión para acceder a tu perfil y funcionalidades.</p>
    <p *ngIf="loginDisplay">Hola, {{ given_name }}!</p>
  </section>
  <router-outlet></router-outlet>
</main>
<app-footer></app-footer>
