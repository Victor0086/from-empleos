<div class="container py-4">
  <div class="alert alert-info">
    <strong>Crear Nueva Oferta:</strong> Completa los campos a continuación para publicar tu oferta laboral.
  </div>
  <div class="row justify-content-center">
    <div class="col-12 col-lg-8">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h2 class="mb-4 text-center">Crear Nueva Oferta Laboral</h2>

          <form [formGroup]="form" (ngSubmit)="save()">
            <div class="row g-3">
              <div class="col-12 col-md-8">
                <mat-form-field class="w-100" appearance="outline">
                  <mat-label>Título del puesto</mat-label>
                  <input matInput formControlName="titulo" placeholder="Ej: Desarrollador Frontend">
                </mat-form-field>
              </div>

              <div class="col-12 col-md-4">
                <mat-form-field class="w-100" appearance="outline">
                  <mat-label>Comuna</mat-label>
                  <input matInput formControlName="comuna">
                </mat-form-field>
              </div>

              <div class="col-md-6">
                <mat-form-field class="w-100" appearance="outline">
                  <mat-label>Área</mat-label>
                  <mat-select formControlName="area">
                    <mat-option *ngFor="let a of areas" [value]="a">{{ a }}</mat-option>
                  </mat-select>
                </mat-form-field>
              </div>

              <div class="col-md-6">
                <mat-form-field class="w-100" appearance="outline">
                  <mat-label>Tipo de empleo</mat-label>
                  <mat-select formControlName="tipo">
                    <mat-option *ngFor="let t of tipos" [value]="t.value">{{ t.label }}</mat-option>
                  </mat-select>
                </mat-form-field>
              </div>

              <div class="col-md-6">
                <mat-form-field class="w-100" appearance="outline">
                  <mat-label>Sueldo desde</mat-label>
                  <input matInput type="number" formControlName="sueldoDesde">
                </mat-form-field>
              </div>

              <div class="col-md-6">
                <mat-form-field class="w-100" appearance="outline">
                  <mat-label>Sueldo hasta</mat-label>
                  <input matInput type="number" formControlName="sueldoHasta">
                </mat-form-field>
              </div>

              <div class="col-12">
                <mat-form-field appearance="outline" class="w-100">
                  <mat-label>Descripción</mat-label>
                  <textarea matInput rows="4" formControlName="descripcion"></textarea>
                </mat-form-field>
              </div>
            </div>

            <div class="d-flex gap-2 mt-3">
              <button mat-raised-button color="primary" [disabled]="form.invalid || enviando">
                {{ enviando ? 'Publicando...' : 'Publicar' }}
              </button>
              <button mat-stroked-button type="button">Guardar borrador</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
