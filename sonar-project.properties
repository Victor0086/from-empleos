# Identificador único del proyecto en SonarQube
sonar.projectKey=instantjob-ui
sonar.projectName=InstantJob UI
sonar.projectVersion=1.0

# Dónde está el código fuente
sonar.sources=src

# Qué excluir del análisis (librerías y archivos de prueba)
sonar.exclusions=**/node_modules/**,**/*.spec.ts,**/*.mock.ts

# Dónde están los archivos de prueba
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts

# Configuración del servidor (Local con Docker)
sonar.host.url=http://localhost:9000

# Token de autenticación (Reemplaza con el que generaste en SonarQube)
# Si no quieres ponerlo aquí por seguridad, puedes pasarlo en el comando
# sonar.token=tu_token_aqui

# Codificación
sonar.sourceEncoding=UTF-8
```

### Paso 3: Ejecutar el Análisis

Ahora, ejecuta el comando para iniciar el escaneo. Tienes dos opciones:

**Opción A: Pasando el token directamente (Más seguro/rápido)**
Reemplaza `TU_TOKEN_GENERADO` por el token que te dio SonarQube al crear el proyecto.

```bash
npx sonar-scanner -Dsonar.token=TU_TOKEN_GENERADO
```

**Opción B: Si pusiste el token en el archivo `.properties`**
Simplemente ejecuta:

```bash
npx sonar-scanner